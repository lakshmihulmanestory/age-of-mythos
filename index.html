<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Age of Mythos — The Complete Saga</title>
  <link rel="stylesheet" href="assets/aom.css">
  <style>
    body { background: var(--aom-bg); color: var(--aom-text); font-family: Georgia, serif; }
    .home-hero { text-align:center; padding:70px 24px 30px; position:relative; overflow:hidden; }
    .home-hero::before { content:''; position:absolute; inset:0;
      background:radial-gradient(ellipse at center top, rgba(196,77,170,.14) 0%, transparent 62%); pointer-events:none; }
    .home-hero .eyebrow { font-size:.62rem; letter-spacing:6px; text-transform:uppercase; color:var(--aom-gold); opacity:.85; margin-bottom:18px; }
    .home-hero h1 { font-size:clamp(2.4rem,7vw,5rem); letter-spacing:8px; line-height:1.05;
      text-shadow:0 0 70px rgba(196,77,170,.4); margin-bottom:14px; }
    .home-hero h1 span { color:var(--vol-accent); }
    .motto-sa { font-size:clamp(1rem,2.5vw,1.35rem); color:var(--aom-gold); letter-spacing:1px; margin:10px 0 4px; }
    .motto-en { font-size:.9rem; color:var(--aom-dim); font-style:italic; line-height:1.7; max-width:560px; margin:0 auto; }
    .home-cta { display:flex; gap:14px; justify-content:center; flex-wrap:wrap; margin:34px 0 8px; }
    .cta { text-decoration:none; padding:14px 30px; border-radius:30px; font-size:.72rem; letter-spacing:2px;
      text-transform:uppercase; transition:all .18s; }
    .cta.primary { background:var(--vol-accent); color:var(--aom-bg); font-weight:bold; }
    .cta.primary:hover { filter:brightness(1.12); transform:translateY(-2px); }
    .cta.ghost { border:1px solid var(--vol-accent); color:var(--vol-accent); }
    .cta.ghost:hover { background:var(--aom-glow); }
    .home-stats { display:flex; gap:8px 26px; justify-content:center; flex-wrap:wrap; margin:26px auto 0;
      font-size:.64rem; letter-spacing:2px; text-transform:uppercase; color:var(--aom-dim); opacity:.8; }
    .home-stats b { color:var(--aom-gold); }
    .home-divider { display:flex; align-items:center; gap:16px; max-width:340px; margin:46px auto 28px; }
    .home-divider::before, .home-divider::after { content:''; flex:1; height:1px;
      background:linear-gradient(90deg, transparent, var(--aom-gold), transparent); opacity:.35; }
    .home-divider span { color:var(--aom-gold); opacity:.6; font-size:.6rem; letter-spacing:4px; text-transform:uppercase; }

    .vol-grid { max-width:1180px; margin:0 auto; padding:0 22px 80px;
      display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:20px; }
    .vol-card { border:1px solid var(--vc); border-radius:14px; overflow:hidden; background:var(--aom-bg2);
      transition:transform .15s, box-shadow .15s; }
    .vol-card:hover { transform:translateY(-3px); box-shadow:0 14px 40px -18px var(--vc); }
    .vol-card .vc-head { display:block; text-decoration:none; padding:22px 22px 18px;
      background:linear-gradient(135deg, var(--vcg) 0%, transparent 70%); border-bottom:1px solid var(--vc); }
    .vol-card .vc-num { font-size:.58rem; letter-spacing:3px; text-transform:uppercase; color:var(--vc); opacity:.9; }
    .vol-card .vc-title { font-size:1.5rem; color:var(--aom-text); letter-spacing:1px; margin:4px 0 2px; }
    .vol-card .vc-sub { font-size:.74rem; color:var(--aom-dim); font-style:italic; }
    .vc-status { float:right; font-size:.55rem; letter-spacing:1.5px; text-transform:uppercase;
      padding:4px 10px; border-radius:14px; border:1px solid var(--vc); color:var(--vc); }
    .vc-status.soon { border-color:rgba(255,255,255,.18); color:var(--aom-dim); }
    .vc-chaps { padding:14px 18px 18px; display:grid; gap:8px; }
    .vc-chap { display:flex; justify-content:space-between; align-items:center; text-decoration:none;
      padding:10px 14px; border-radius:9px; border:1px solid rgba(255,255,255,.08); background:rgba(255,255,255,.02);
      color:var(--aom-dim); font-size:.78rem; transition:all .15s; }
    .vc-chap:hover { border-color:var(--vc); color:#fff; background:var(--aom-glow); }
    .vc-chap .n { font-size:.58rem; letter-spacing:1px; text-transform:uppercase; color:var(--vc); opacity:.85; }
  </style>
</head>
<body class="aom" data-aom-type="root">

  <section class="home-hero">
    <div class="eyebrow">An Epic in Six Volumes</div>
    <h1>AGE OF <span>MYTHOS</span></h1>
    <div class="motto-sa">यतो योग्यता ततो सत्यम् · यतो ऋतम् ततो जयः</div>
    <p class="motto-en">Where worthiness stands, truth stands.<br>Where cosmic order stands, victory stands.</p>
    <div class="home-cta">
      <a class="cta primary" id="cta-read" href="#">▸ Start Reading in Order</a>
      <a class="cta ghost" href="hierarchy.html">✦ Explore the Map</a>
    </div>
    <div class="home-stats">
      <span><b>6</b> Volumes</span>
      <span><b>24</b> Chapters</span>
      <span><b>30</b> Kingdoms</span>
      <span><b>1</b> Maha-Adhipati</span>
    </div>
  </section>

  <div class="home-divider"><span>The Six Volumes</span></div>

  <section class="vol-grid" id="vol-grid"></section>

  <div class="home-divider" id="world-divider" style="display:none"><span>World &amp; Lore</span></div>
  <section class="vol-grid" id="world-grid" style="grid-template-columns:repeat(auto-fill,minmax(240px,1fr))"></section>

  <script src="assets/manifest.js"></script>
  <script>
    (function () {
      var M = window.AOM_MANIFEST;
      if (!M) return;
      // primary CTA -> first page of the reading spine
      var read = document.getElementById('cta-read');
      if (M.spine && M.spine.length) read.href = M.spine[0];

      var grid = document.getElementById('vol-grid');
      (M.nav.volumes || []).forEach(function (v) {
        var card = document.createElement('div');
        card.className = 'vol-card';
        card.style.setProperty('--vc', v.accent);
        // translucent glow from accent
        card.style.setProperty('--vcg', v.accent + '22');

        var status = v.available
          ? '<span class="vc-status">Available</span>'
          : '<span class="vc-status soon">Coming Soon</span>';

        var head =
          '<a class="vc-head" href="' + v.rel + '">' + status +
            '<div class="vc-num">Volume ' + roman(v.n) + '</div>' +
            '<div class="vc-title">' + v.title + '</div>' +
            '<div class="vc-sub">' + (v.subtitle || '') + '</div>' +
          '</a>';

        var chaps = '<div class="vc-chaps">';
        (v.chapters || []).forEach(function (c) {
          chaps += '<a class="vc-chap" href="' + c.rel + '">' +
                     '<span>' + c.title + '</span>' +
                     '<span class="n">Ch ' + c.n + '</span></a>';
        });
        chaps += '</div>';

        card.innerHTML = head + chaps;
        grid.appendChild(card);
      });

      function roman(n){ return ['','I','II','III','IV','V','VI'][n] || n; }

      // World & Lore links
      var world = (M.nav && M.nav.world) || [];
      if (world.length) {
        document.getElementById('world-divider').style.display = '';
        var wg = document.getElementById('world-grid');
        world.forEach(function (x) {
          var a = document.createElement('a');
          a.href = x.rel; a.className = 'vc-chap'; a.style.padding = '16px';
          a.innerHTML = '<span>' + x.title + '</span><span class="n">Lore</span>';
          wg.appendChild(a);
        });
      }
    })();
  </script>
  <script src="assets/aom.js"></script>
</body>
</html>
