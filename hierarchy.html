<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Map — Age of Mythos</title>
  <link rel="stylesheet" href="assets/aom.css">
  <style>
    body { background:var(--aom-bg); color:var(--aom-text); font-family:Georgia,serif; }
    .map-head { text-align:center; padding:50px 24px 24px; }
    .map-head .eyebrow { font-size:.6rem; letter-spacing:5px; text-transform:uppercase; color:var(--aom-gold); margin-bottom:12px; }
    .map-head h1 { font-size:clamp(1.9rem,5vw,3rem); letter-spacing:4px; }
    .map-head p { color:var(--aom-dim); font-size:.82rem; margin-top:10px; font-style:italic; }
    .map { max-width:1000px; margin:0 auto; padding:10px 20px 90px; }

    details.vol { border:1px solid var(--vc); border-radius:12px; margin-bottom:16px; overflow:hidden; background:var(--aom-bg2); }
    details.vol > summary { list-style:none; cursor:pointer; padding:18px 22px;
      background:linear-gradient(135deg, var(--vc) 0%, transparent 70%); display:flex; align-items:center; gap:14px; }
    details.vol > summary { background:rgba(255,255,255,.02); }
    details.vol > summary::-webkit-details-marker { display:none; }
    .vbadge { font-size:.55rem; letter-spacing:2px; text-transform:uppercase; color:var(--vc); border:1px solid var(--vc); padding:3px 9px; border-radius:12px; }
    .vname { font-size:1.25rem; letter-spacing:1px; }
    .vsub { font-size:.72rem; color:var(--aom-dim); font-style:italic; margin-left:auto; }
    .soon-tag { font-size:.55rem; letter-spacing:1.5px; text-transform:uppercase; color:var(--aom-dim); border:1px solid rgba(255,255,255,.16); padding:3px 9px; border-radius:12px; margin-left:auto; }

    .chap { margin:0 16px 12px; }
    details.chapter { border-left:2px solid var(--cc); margin:10px 0; }
    details.chapter > summary { list-style:none; cursor:pointer; padding:10px 16px; font-size:.92rem; color:var(--cc); letter-spacing:1px; }
    details.chapter > summary::-webkit-details-marker { display:none; }
    details.chapter > summary .cn { font-size:.56rem; letter-spacing:1px; text-transform:uppercase; opacity:.7; margin-right:8px; }
    a.chap-open { font-size:.62rem; color:var(--aom-dim); text-decoration:none; margin-left:10px; border-bottom:1px dotted; }

    .region { margin:6px 0 6px 18px; }
    .region-label { font-size:.58rem; letter-spacing:2px; text-transform:uppercase; color:var(--aom-dim); opacity:.7; margin:12px 0 6px; }
    .kingdoms { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:8px; }
    .kingdom { border:1px solid rgba(255,255,255,.08); border-radius:9px; padding:10px 12px; background:rgba(255,255,255,.02); }
    .kingdom > a.kname { color:var(--ka); text-decoration:none; font-size:.85rem; display:flex; align-items:center; gap:7px; }
    .kingdom > a.kname::before { content:''; width:9px; height:9px; border-radius:50%; background:var(--ka); display:inline-block; flex:0 0 auto; }
    .kingdom > a.kname:hover { text-decoration:underline; }
    .stories { margin:7px 0 0 16px; display:grid; gap:3px; }
    .stories a { color:var(--aom-dim); font-size:.72rem; text-decoration:none; }
    .stories a::before { content:'\203A  '; color:var(--ka); }
    .stories a:hover { color:#fff; }
  </style>
</head>
<body class="aom" data-aom-type="root">

  <div class="map-head">
    <div class="eyebrow">The Complete Atlas</div>
    <h1>The Map of Mythos</h1>
    <p>Every volume, chapter, kingdom, and story — pick any thread, or read straight through.</p>
  </div>

  <div class="map" id="map"></div>

  <script src="assets/manifest.js"></script>
  <script>
    (function () {
      var M = window.AOM_MANIFEST; if (!M) return;
      var root = document.getElementById('map');
      function roman(n){ return ['','I','II','III','IV','V','VI'][n] || n; }
      function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;'); }

      (M.nav.volumes || []).forEach(function (v) {
        var vol = document.createElement('details');
        vol.className = 'vol';
        if (v.available) vol.open = true;
        vol.style.setProperty('--vc', v.accent);

        var summary = '<summary><span class="vbadge">Vol ' + roman(v.n) + '</span>' +
          '<span class="vname">' + esc(v.title) + '</span>' +
          (v.available ? '<span class="vsub">' + esc(v.subtitle||'') + '</span>'
                       : '<span class="soon-tag">Coming Soon</span>') + '</summary>';

        var body = '<div class="chap">';
        (v.chapters || []).forEach(function (c) {
          var open = c.available ? ' open' : '';
          body += '<details class="chapter"' + open + ' style="--cc:' + c.accent + '">' +
            '<summary><span class="cn">Chapter ' + c.n + '</span>' + esc(c.title) +
            (c.available ? ' <a class="chap-open" href="' + c.rel + '">open hub →</a>' : '') +
            '</summary>';
          (c.regions || []).forEach(function (r) {
            body += '<div class="region"><div class="region-label">' + esc(r.label) + ' Region</div><div class="kingdoms">';
            (r.kingdoms || []).forEach(function (k) {
              body += '<div class="kingdom" style="--ka:' + k.accent + '">' +
                '<a class="kname" href="' + (k.rel || '#') + '">' + esc(k.name) + '</a>';
              if (k.stories && k.stories.length) {
                body += '<div class="stories">';
                k.stories.forEach(function (s) {
                  body += '<a href="' + s.rel + '">' + esc(s.title) + '</a>';
                });
                body += '</div>';
              }
              body += '</div>';
            });
            body += '</div></div>';
          });
          body += '</details>';
        });
        body += '</div>';

        vol.innerHTML = summary + body;
        root.appendChild(vol);
      });

      var world = (M.nav && M.nav.world) || [];
      if (world.length) {
        var wd = document.createElement('details');
        wd.className = 'vol'; wd.open = true;
        wd.style.setProperty('--vc', '#d4952a');
        var b = '<summary><span class="vbadge">Lore</span>' +
                '<span class="vname">World &amp; Lore</span></summary>' +
                '<div class="chap"><div class="region"><div class="kingdoms">';
        world.forEach(function (x) {
          b += '<div class="kingdom" style="--ka:#d4952a">' +
               '<a class="kname" href="' + x.rel + '">' + esc(x.title) + '</a></div>';
        });
        b += '</div></div></div>';
        wd.innerHTML = b;
        root.appendChild(wd);
      }
    })();
  </script>
  <script src="assets/aom.js"></script>
</body>
</html>
